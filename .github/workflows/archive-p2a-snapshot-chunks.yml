name: Archive P2A Registry Snapshot Chunks

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/archive-p2a-snapshot-chunks.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: '9707827019'
      SOURCE_RUN_ID: '33228804380'
      SOURCE_SIZE: '4381625928'
      SOURCE_SHA256: '84581c47f1b3fcb29f3a311b28b29cfdb36d2b84ba538507e54daf4445fa6a4b'
    steps:
      - name: Download exact final P2A artifact archive
        run: |
          set -euo pipefail
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            > p2a-final.zip
          test "$(stat -c%s p2a-final.zip)" = "$SOURCE_SIZE"
          echo "$SOURCE_SHA256  p2a-final.zip" | sha256sum -c -

      - name: Split archive into connector-safe chunks and build manifest
        run: |
          set -euo pipefail
          mkdir -p chunks manifest
          split -b 400MiB -d -a 2 p2a-final.zip chunks/p2a-registry-final.zip.part-
          test "$(find chunks -type f | wc -l)" = '11'
          cat > manifest/source.json <<EOF
          {
            "schema_version": "P2A-DRIVE-SNAPSHOT-CHUNKS-1.0",
            "source_repo": "${GITHUB_REPOSITORY}",
            "source_run_id": ${SOURCE_RUN_ID},
            "source_artifact_id": ${SOURCE_ARTIFACT_ID},
            "source_artifact_name": "global-corpus-registry-occurrence-index",
            "source_size_bytes": ${SOURCE_SIZE},
            "source_sha256": "${SOURCE_SHA256}",
            "chunk_size_policy": "400MiB",
            "chunk_count": 11,
            "reassembly": "cat p2a-registry-final.zip.part-* > global-corpus-registry-occurrence-index.zip"
          }
          EOF
          sha256sum chunks/* > manifest/chunks.sha256
          stat -c '%n,%s' chunks/* > manifest/chunks.csv
          cat manifest/source.json
          cat manifest/chunks.csv
          cat manifest/chunks.sha256

      - name: Upload archive manifest
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-snapshot-manifest
          path: manifest/
          retention-days: 90
          compression-level: 0

      - name: Upload chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-snapshot-chunk-00
          path: chunks/p2a-registry-final.zip.part-00
          retention-days: 90
          compression-level: 0
      - name: Upload chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-snapshot-chunk-01
          path: chunks/p2a-registry-final.zip.part-01
          retention-days: 90
          compression-level: 0
      - name: Upload chunk 02
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-snapshot-chunk-02
          path: chunks/p2a-registry-final.zip.part-02
          retention-days: 90
          compression-level: 0
      - name: Upload chunk 03
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-snapshot-chunk-03
          path: chunks/p2a-registry-final.zip.part-03
          retention-days: 90
          compression-level: 0
      - name: Upload chunk 04
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-snapshot-chunk-04
          path: chunks/p2a-registry-final.zip.part-04
          retention-days: 90
          compression-level: 0
      - name: Upload chunk 05
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-snapshot-chunk-05
          path: chunks/p2a-registry-final.zip.part-05
          retention-days: 90
          compression-level: 0
      - name: Upload chunk 06
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-snapshot-chunk-06
          path: chunks/p2a-registry-final.zip.part-06
          retention-days: 90
          compression-level: 0
      - name: Upload chunk 07
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-snapshot-chunk-07
          path: chunks/p2a-registry-final.zip.part-07
          retention-days: 90
          compression-level: 0
      - name: Upload chunk 08
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-snapshot-chunk-08
          path: chunks/p2a-registry-final.zip.part-08
          retention-days: 90
          compression-level: 0
      - name: Upload chunk 09
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-snapshot-chunk-09
          path: chunks/p2a-registry-final.zip.part-09
          retention-days: 90
          compression-level: 0
      - name: Upload chunk 10
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-snapshot-chunk-10
          path: chunks/p2a-registry-final.zip.part-10
          retention-days: 90
          compression-level: 0
