name: Mine P2A Banquanshi Audit
on:
  push:
    paths:
      - '.github/workflows/mine-p2a-banquanshi-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: python -m pip install --disable-pip-version-check 'pyarrow>=23,<24'
      - name: Download canonical P2A artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request, json, zipfile, pathlib, os
          req=urllib.request.Request('https://api.github.com/repos/rayzh2012/playground/actions/artifacts/9707827019/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=urllib.request.urlopen(req).read()
          open('p2a.zip','wb').write(data)
          with zipfile.ZipFile('p2a.zip') as z: z.extractall('p2a')
          print(len(data))
          PY
      - name: Banquanshi targeted audit
        shell: python
        run: |
          import pathlib, csv, json, re, collections
          import pyarrow.parquet as pq
          root=pathlib.Path('p2a'); out=pathlib.Path('out'); out.mkdir()
          files=list(root.rglob('*.parquet'))
          rows=[]
          pats={
            'BANQUAN_SHI':re.compile('阪泉氏'),
            'BANQUAN_TO_DULU':re.compile('阪泉氏.{0,120}(独鹿|獨鹿)|(独鹿|獨鹿).{0,120}阪泉氏'),
            'BANQUAN_TO_ZHUOLU':re.compile('阪泉氏.{0,120}涿鹿|涿鹿.{0,120}阪泉氏'),
            'BANQUAN_TO_CHIYOU':re.compile('阪泉氏.{0,120}蚩尤|蚩尤.{0,120}阪泉氏'),
            'BANQUAN_TO_YANDI':re.compile('阪泉氏.{0,120}炎帝|炎帝.{0,120}阪泉氏'),
            'BANQUAN_IDENTITY_YANDI':re.compile('(阪泉氏.{0,80}(即|就是|乃|为|為|指|系|係).{0,40}炎帝|炎帝.{0,80}(即|就是|乃|为|為|指|系|係).{0,40}阪泉氏)'),
            'BANQUAN_IDENTITY_CHIYOU':re.compile('(阪泉氏.{0,80}(即|就是|乃|为|為|指|系|係).{0,40}蚩尤|蚩尤.{0,80}(即|就是|乃|为|為|指|系|係).{0,40}阪泉氏)'),
          }
          for f in files:
            try:
              t=pq.read_table(f)
            except: continue
            cols=t.column_names
            ctx_col='context' if 'context' in cols else ('text' if 'text' in cols else None)
            alias_col='alias' if 'alias' in cols else None
            if not ctx_col: continue
            d=t.to_pydict(); n=len(d[ctx_col])
            for i in range(n):
              ctx=d[ctx_col][i]
              if not isinstance(ctx,str) or '阪泉' not in ctx: continue
              alias=d[alias_col][i] if alias_col else ''
              for name,p in pats.items():
                if p.search(ctx):
                  rows.append({'test':name,'alias':alias,'context':ctx,'file':str(f.relative_to(root))})
          c=collections.Counter(r['test'] for r in rows)
          with open(out/'summary.csv','w',encoding='utf-8-sig',newline='') as f:
            w=csv.writer(f); w.writerow(['test','hits','dedup_contexts']);
            for k in pats: w.writerow([k,c[k],len({r['context'] for r in rows if r['test']==k})])
          # sample dedup contexts
          seen=set(); samples=[]
          for r in rows:
            key=(r['test'],re.sub(r'\s+','',r['context']))
            if key in seen: continue
            seen.add(key); samples.append(r)
          with open(out/'samples.jsonl','w',encoding='utf-8') as f:
            for r in samples[:1000]: f.write(json.dumps(r,ensure_ascii=False)+'\n')
          json.dump({'tests':list(pats),'total_hits':len(rows),'sample_count':min(1000,len(samples))},open(out/'manifest.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          assert c['BANQUAN_SHI']>0
          print(c)
      - name: Gate
        run: python -c "import csv; r=list(csv.DictReader(open('out/summary.csv',encoding='utf-8-sig'))); assert len(r)==7; assert int(r[0]['hits'])>0; print('BANQUANSHI_GATE=PASS')"
      - uses: actions/upload-artifact@v4
        with:
          name: p2a-banquanshi-audit
          path: out/
          if-no-files-found: error
