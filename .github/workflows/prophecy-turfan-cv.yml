name: Prophecy Turfan CV

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label: ubuntu-latest or self-hosted'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
      local_source_dir:
        description: 'Self-hosted only: local directory containing PDFs'
        required: false
        default: ''
      public_urls:
        description: 'Hosted mode: newline-separated direct PDF URLs'
        required: false
        default: ''
      page_start:
        description: '1-based inclusive page start per PDF'
        required: true
        default: '1'
      page_end:
        description: '1-based inclusive page end per PDF; 0 = end'
        required: true
        default: '0'
      threshold:
        description: 'Candidate score threshold'
        required: true
        default: '3'
      dpi:
        description: 'Render DPI'
        required: true
        default: '140'
      workers:
        description: 'Parallel Tesseract workers'
        required: true
        default: '4'
      lang:
        description: 'Tesseract language; auto chooses installed Chinese packs'
        required: true
        default: 'auto'

jobs:
  triage:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system OCR
        shell: bash
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-chi-tra
          elif command -v brew >/dev/null 2>&1; then
            brew list tesseract >/dev/null 2>&1 || brew install tesseract
            echo 'Self-hosted Mac: language selection is auto-detected; install Chinese tessdata if absent.'
          fi
          tesseract --list-langs || true

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pymupdf

      - name: Resolve input PDFs
        id: input
        shell: bash
        env:
          LOCAL_SOURCE_DIR: ${{ inputs.local_source_dir }}
          PUBLIC_URLS: ${{ inputs.public_urls }}
        run: |
          mkdir -p _prophecy_input
          if [ -n "$LOCAL_SOURCE_DIR" ]; then
            if [ ! -d "$LOCAL_SOURCE_DIR" ]; then
              echo "Local source directory does not exist: $LOCAL_SOURCE_DIR" >&2
              exit 20
            fi
            find "$LOCAL_SOURCE_DIR" -type f -iname '*.pdf' -print0 | xargs -0 -I{} cp -n "{}" _prophecy_input/
          fi
          if [ -n "$PUBLIC_URLS" ]; then
            i=0
            while IFS= read -r url; do
              [ -z "$url" ] && continue
              i=$((i+1))
              curl -L --fail --retry 3 "$url" -o "_prophecy_input/url_${i}.pdf"
            done <<< "$PUBLIC_URLS"
          fi
          count=$(find _prophecy_input -maxdepth 1 -type f -iname '*.pdf' | wc -l | tr -d ' ')
          echo "pdf_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo 'No PDFs resolved. Self-hosted: pass local_source_dir. Hosted: pass direct public PDF URLs.' >&2
            exit 21
          fi

      - name: Run chunked CV/OCR triage
        run: |
          python research/prophecy_turfan/scripts/extract_candidates.py \
            --input-dir _prophecy_input \
            --output-dir _prophecy_output \
            --threshold '${{ inputs.threshold }}' \
            --dpi '${{ inputs.dpi }}' \
            --workers '${{ inputs.workers }}' \
            --lang '${{ inputs.lang }}' \
            --page-start '${{ inputs.page_start }}' \
            --page-end '${{ inputs.page_end }}'

      - name: Preserve candidate package
        uses: actions/upload-artifact@v4
        with:
          name: prophecy-turfan-candidates-${{ github.run_id }}-p${{ inputs.page_start }}-${{ inputs.page_end }}
          path: |
            _prophecy_output/manifest.csv
            _prophecy_output/summary.json
            _prophecy_output/page_results/*.json
            _prophecy_output/candidates/*.png
            research/prophecy_turfan/prompts/kimi_cv_review.md
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        shell: bash
        run: |
          echo '## Prophecy × Turfan CV' >> "$GITHUB_STEP_SUMMARY"
          echo "PDFs: ${{ steps.input.outputs.pdf_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages requested per PDF: ${{ inputs.page_start }}..${{ inputs.page_end }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Workers: ${{ inputs.workers }}; DPI: ${{ inputs.dpi }}; lang: ${{ inputs.lang }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'OCR/CV hits are leads only; verify against raw images and archaeological context.' >> "$GITHUB_STEP_SUMMARY"
          echo 'For Kimi Code, review the candidate artifact with research/prophecy_turfan/prompts/kimi_cv_review.md.' >> "$GITHUB_STEP_SUMMARY"
