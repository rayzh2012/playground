name: Build Global Corpus Index Pilot

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-global-corpus-index.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index-26histories:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout indexing branch
        uses: actions/checkout@v4
        with:
          ref: global-corpus-index-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax gate
        run: python -m py_compile tools/global_corpus_index.py

      - name: Fetch canonical 26 Histories corpus
        run: |
          rm -rf external/ahua-dataset
          mkdir -p external
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ahua/dataset.git external/ahua-dataset
          git -C external/ahua-dataset sparse-checkout set '26史'
          # The upstream folder also contains derived files such as 史记freq.txt.
          # They are not witnesses and must never enter the canonical corpus.
          find external/ahua-dataset/26史 -maxdepth 1 -type f -name '*freq*.txt' -print -delete
          COUNT=$(find external/ahua-dataset/26史 -maxdepth 1 -type f -name '*.txt' | wc -l)
          echo "Canonical 26 Histories txt files: $COUNT"
          test "$COUNT" -eq 26

      - name: Corpus integrity gate
        run: |
          mkdir -p global_index_output/26histories
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('external/ahua-dataset/26史')
          files = sorted(root.glob('*.txt'))
          def normalize(s):
              return s.replace('\ufeff','').replace('\r\n','\n').replace('\r','\n')
          rows=[]
          total=0
          for p in files:
              text=normalize(p.read_text(encoding='utf-8', errors='replace'))
              n=len(text)
              total += n
              rows.append({'file':p.name,'normalized_chars':n,'bytes':p.stat().st_size})
          # Source truth was already recorded in the durable 2026-07-23 manifest:
          # total=36,871,517. The older hard-coded 36,871,518 constant was off by
          # one because 附25新元史 is 2,027,141 chars, not 2,027,142.
          SOURCE_TRUTH = 36_871_517
          result={
              'canonical_file_count':len(files),
              'normalized_source_character_count':total,
              'expected_normalized_source_character_count':SOURCE_TRUTH,
              'legacy_expected_constant':36_871_518,
              'legacy_constant_error':'附25新元史 expected 2,027,142; durable manifest measures 2,027,141',
              'exact_match': total == SOURCE_TRUTH,
              'files':rows,
          }
          Path('global_index_output/26histories/corpus_integrity.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in result.items() if k!='files'},ensure_ascii=False))
          assert len(files)==26, len(files)
          assert total==SOURCE_TRUTH, total
          PY

      - name: Build locator + lexical + entity occurrence index
        run: |
          python tools/global_corpus_index.py \
            --mode txt \
            --input external/ahua-dataset/26史 \
            --corpus-id GCI-HOLD-0003 \
            --out global_index_output/26histories \
            --registry corpus_index/entity_registry.tsv \
            --pilot-queries '蚩尤,炎帝,赤帝,黄帝,共工,帝鸿,少昊,太昊,颛顼,九黎' \
            --limit 25

      - name: Acceptance gates
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root = Path('global_index_output/26histories')
          m = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          integrity = json.loads((root/'corpus_integrity.json').read_text(encoding='utf-8'))
          assert m['file_count'] == 26, m
          assert integrity['exact_match'] is True, integrity
          assert integrity['normalized_source_character_count'] == 36_871_517, integrity
          assert m['unit_count'] > 0, m
          assert m['character_count'] > 30_000_000, m
          assert m['raw_corpus_mutated'] is False, m
          db = sqlite3.connect(root/'lexical_index.sqlite')
          docs = db.execute('select count(*) from docs').fetchone()[0]
          fts = db.execute('select count(*) from fts').fetchone()[0]
          db.close()
          assert docs == fts == m['unit_count'], (docs, fts, m['unit_count'])
          assert (root/'query_smoke.csv').stat().st_size > 100
          assert (root/'entity_occurrences.csv').stat().st_size > 100
          print({
              'files':m['file_count'],
              'normalized_source_chars':integrity['normalized_source_character_count'],
              'indexed_content_chars':m['character_count'],
              'units':m['unit_count'],
              'entity_occ':m['entity_occurrence_count'],
          })
          PY

      - name: Upload reusable index artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-corpus-index-26histories
          path: global_index_output/26histories/
          retention-days: 90

      - name: Persist small durable index manifests on analysis branch
        run: |
          mkdir -p artifacts/global_corpus_index/26histories
          cp global_index_output/26histories/corpus_integrity.json artifacts/global_corpus_index/26histories/
          cp global_index_output/26histories/manifest.json artifacts/global_corpus_index/26histories/
          cp global_index_output/26histories/source_manifest.csv artifacts/global_corpus_index/26histories/
          cp global_index_output/26histories/entity_occurrences.csv artifacts/global_corpus_index/26histories/
          cp global_index_output/26histories/query_smoke.csv artifacts/global_corpus_index/26histories/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/global_corpus_index/26histories
          git commit -m 'chore: persist global corpus index pilot manifests [skip ci]' || true
          git fetch origin global-corpus-index-v1
          git rebase origin/global-corpus-index-v1
          git push origin HEAD:global-corpus-index-v1
